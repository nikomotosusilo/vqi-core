<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VQI V16 Gold Fixed</title>
<style>:root{--bg:#0a0f1e;--card:#14204a;--gold:#f5c542;
--green:#1aff66;--text:#e8ecff;--muted:#7a86b3}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);color:var(--text);padding:12px 12px 90px}
.card{background:linear-gradient(180deg,#14204a,#0e1838);
border:1px solid rgba(245,197,66,.18);border-radius:22px;padding:16px}
.bal{font-size:32px;font-weight:900;text-align:center}
.btn-mine{width:100%;height:50px;border-radius:14px;border:0;
background:var(--green);font-weight:900;margin-top:10px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;
justify-content:space-around;background:#0a0f1e;padding:10px 0}
.nav a{color:var(--muted);text-decoration:none;font-size:11px}
.hide{display:none}
</style></head><body>
<div class="card">
<div style="text-align:center;font-size:10px;color:var(--muted)">
TOTAL BALANCE • 195 COUNTRIES</div>
<div class="bal">$17,314.89 REAL</div>
<div id="box" style="margin-top:12px;background:#162656;
border-radius:16px;padding:12px">
<div>Reward $250</div><div id="tm" style="font-size:36px;
font-weight:900;text-align:center">10:00</div>
<div id="sha" style="font-family:monospace;font-size:8px;
background:#080e24;padding:8px;border-radius:8px">- hash -</div>
<button class="btn-mine" id="mineBtn">
START MINING 10 MIN REQUIRED</button>
</div></div>
<div id="oldPage" class="hide">V15 FULL APP - MINING CORE</div>
<div class="nav">
<a>🏠<br>Home</a><a>👛<br>Wallet</a>
<a onclick="return false" style="color:var(--gold)">⛏️<br>Mine</a>
<a>🎁<br>Rewards</a></div>
<script>
let l=600,run=false;
const $=id=>document.getElementById(id);
$('mineBtn').onclick=()=>{
 if(run) return; run=true; let t=setInterval(()=>{
 l--; $('tm').textContent=String(Math.floor(l/60)).padStart(2,'0')
 +':'+String(l%60).padStart(2,'0');
 $('sha').textContent=Math.random().toString(16).slice(2).repeat(4);
 if(l<=0){clearInterval(t);$('mineBtn').textContent='CLAIM $250'}}
 ,1000)}};
</script></body></html>
