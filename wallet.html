<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VQI V26.1 FINAL</title>
<script type="importmap">{"imports":{"ethers":"https://cdn.jsdelivr.net/npm/ethers@6.9.2/+esm"}}</script>
<style>
body{background:#0a0f1e;color:#fff;font-family:sans-serif;padding:12px;margin:0}
.card{background:#111a2e;border:1px solid #d4af37;border-radius:16px;padding:14px;margin:10px 0;word-break:break-all}
.btn{background:#d4af37;color:#000;padding:14px;width:100%;border-radius:12px;font-weight:bold;border:none;margin:6px 0}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;background:#0a0f1e;border:1px solid #333;color:#fff;box-sizing:border-box}
.mono{font-family:monospace;font-size:11px;color:#8fa0c0}
.row{display:flex;justify-content:space-between;padding:8px;background:#0f1a33;border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<h2 style="color:#d4af37;text-align:center">⚛️ VQI V26.1 FINAL FIXED</h2>

<div id="setup" class="card">
<b>🔐 Setup Wallet</b><br>
<input id="pass" type="password" placeholder="Password min 6">
<input id="pass2" type="password" placeholder="Ulangi password">
<button class="btn" onclick="createWallet()">Buat Wallet Secure</button>
</div>

<div id="wallet" class="card" style="display:none">
<div id="addr" class="mono" style="color:#00ff88"></div>
<div id="vqiAddr" class="mono"></div>
Saldo: <b id="bal">0 VQI</b> | Height <span id="height">0</span> | <span id="prog" class="mono">idle</span>
</div>

<div class="card" style="display:flex;gap:8px;align-items:center">
<img id="flag" src="https://flagcdn.com/w40/id.png" width=32>
<select id="country"></select>
</div>

<div style="display:flex;gap:6px;overflow:auto">
<button onclick="loadMarket('coin')" style="background:#1a2440;color:#fff;border-radius:20px;padding:10px;border:1px solid #444">🪙 Coin</button>
<button onclick="loadMarket('forex')" style="background:#1a2440;color:#fff;border-radius:20px;padding:10px;border:1px solid #444">💱 Forex</button>
<button onclick="doMine()" id="mineBtn" style="background:#00ff88;color:#000;border-radius:20px;padding:10px;font-weight:bold">⛏️ MINE +2941</button>
</div>

<div id="market" class="card">Loading...</div>

<div class="card">
<input id="send_to" placeholder="VQI_ atau 0x...">
<input id="send_amt" type="number" placeholder="Jumlah">
<button class="btn" onclick="doSend()">🚀 Send Signed</button>
<button class="btn" style="background:#1a2440;color:#fff" onclick="doHistory()">📜 History</button>
</div>

<div id="chainview" class="card mono" style="display:none;max-height:250px;overflow:auto"></div>

<script type="module">
import { ethers } from "ethers";

let wallet = null;
let chain = [];
let vqiAddr = '';

const sha256 = async (s) => {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
};

window.createWallet = async () => {
  let p = document.getElementById('pass').value;
  let p2 = document.getElementById('pass2').value;
  if(p.length<6 || p!==p2) return alert('Password beda min 6');
  let w = ethers.Wallet.createRandom();
  let enc = await w.encrypt(p);
  localStorage.setItem('vqi_enc', enc);
  alert('CATAT 12 KATA SEKALI:\n' + w.mnemonic.phrase);
  location.reload();
};

async function unlock(){
  let enc = localStorage.getItem('vqi_enc');
  if(!enc) return;
  let pw = prompt('Password wallet:');
  if(!pw) return;
  try{
    wallet = await ethers.Wallet.fromEncryptedJson(enc, pw);
  }catch(e){
    return alert('Password salah');
  }
  vqiAddr = 'VQI_' + (await sha256(wallet.privateKey)).slice(0,40).toUpperCase();
  document.getElementById('setup').style.display='none';
  document.getElementById('wallet').style.display='block';
  document.getElementById('addr').innerText = wallet.address;
  document.getElementById('vqiAddr').innerText = vqiAddr;

  chain = JSON.parse(localStorage.getItem('vqi_chain_v26')||'[]');
  if(chain.length===0){
    chain = [{
      index:0,
      prevHash:'0'.repeat(64),
      hash:await sha256('GENESIS'),
      txs:[],
      nonce:0,
      time:Date.now()
    }];
    saveChain();
  }
  if(!await validateChainSecure()){
    alert('⛔ CHAIN CURANG TERDETEKSI! Reset genesis.');
    chain = [chain[0]];
    saveChain();
  }
  refresh();
  loadMarket('coin');
  renderFlags();
}

// === VALIDASI STRICT V26 - PATCH LU ===
async function validateChainSecure(){
  for(let i=1;i<chain.length;i++){
    let b = chain[i];
    if(b.prevHash!== chain[i-1].hash) return false;
    if(b.txs[0]?.type === 'MINE'){
      if(b.txs[0].amount!== 2941) return false;
      if(!b.hash.startsWith('00')) return false;
    }
    for(let tx of b.txs){
      if(tx.type!== 'MINE'){
        try{
          let msgText = tx.msg || `${tx.type} ${tx.symbol||""} ${tx.usd||tx.amount}`;
          let recovered = ethers.verifyMessage(msgText, tx.sig);
          if(recovered.toLowerCase()!== (tx.ethFrom||wallet.address).toLowerCase()){
            return false;
          }
          if(tx.amount>1000000 || tx.amount<=0) return false;
        }catch(e){
          return false;
        }
      }
    }
  }
  return true;
}

function saveChain(){
  localStorage.setItem('vqi_chain_v26', JSON.stringify(chain));
  refresh();
}

function getBalance(a){
  let b=0;
  chain.forEach(bl=>{
    bl.txs.forEach(tx=>{
      if(tx.to===a) b+=tx.amount;
      if((tx.from===a || tx.ethFrom===wallet?.address) && tx.type!=='MINE') b-=tx.amount;
    });
  });
  return b;
}

window.refresh = () => {
  if(!wallet) return;
  document.getElementById('bal').innerText = getBalance(vqiAddr).toLocaleString() + ' VQI';
  document.getElementById('height').innerText = chain.length-1;
};

window.doMine = async () => {
  let btn = document.getElementById('mineBtn');
  btn.disabled = true;
  document.getElementById('prog').innerText = 'Mining via Worker...';
  let prev = chain[chain.length-1].hash;

  let workerCode = `
    self.onmessage = async (e) => {
      const toHex = (b) => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
      const sha = async (s) => {
        const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
        return toHex(d);
      };
      let {prev, addr} = e.data;
      let n=0;
      while(true){
        let h = await sha(prev+addr+n+Date.now());
        if(h.startsWith('00')){
          postMessage({hash:h, nonce:n});
          break;
        }
        n++;
        if(n%800===0) postMessage({prog:n});
      }
    };
  `;
  let blob = new Blob([workerCode], {type:'application/javascript'});
  let worker = new Worker(URL.createObjectURL(blob));

  worker.onmessage = async (ev) => {
    if(ev.data.prog){
      document.getElementById('prog').innerText = 'Hashing '+ev.data.prog;
      return;
    }
    let {hash, nonce} = ev.data;
    let sig = await wallet.signMessage(hash);
    let block = {
      index: chain.length,
      prevHash: prev,
      hash: hash,
      nonce: nonce,
      time: Date.now(),
      txs: [{
        type:'MINE',
        from:'NETWORK',
        to:vqiAddr,
        ethFrom:'0x0000000000000000000000000000000000000000',
        amount:2941,
        sig:sig,
        msg:hash
      }]
    };
    chain.push(block);
    saveChain();
    btn.disabled = false;
    document.getElementById('prog').innerText = 'Mined #'+block.index;
    worker.terminate();
    alert('✅ MINED +2941 VQI');
  };
  worker.postMessage({prev, addr:vqiAddr});
};

window.doSend = async () => {
  let to = document.getElementById('send_to').value.trim();
  let amt = Number(document.getElementById('send_amt').value);
  if(!to||!amt) return alert('Lengkapi');
  if(getBalance(vqiAddr)<amt) return alert('Saldo kurang');
  let msg = `SEND ${amt} TO ${to} ${Date.now()}`;
  let sig = await wallet.signMessage(msg);
  let prev = chain[chain.length-1].hash;
  let hash = await sha256(prev+to+amt+sig);
  chain.push({
    index:chain.length,
    prevHash:prev,
    hash:hash,
    time:Date.now(),
    txs:[{type:'SEND', from:vqiAddr, ethFrom:wallet.address, to:to, amount:amt, sig:sig, msg:msg}]
  });
  saveChain();
};

window.buy = async (s,u) => {
  let need = u*10000;
  if(getBalance(vqiAddr)<need) return alert('Butuh '+need);
  let msg = `BUY ${s} ${u} ${Date.now()}`;
  let sig = await wallet.signMessage(msg);
  let prev = chain[chain.length-1].hash;
  let hash = await sha256(prev+s+u+sig);
  chain.push({
    index:chain.length,
    prevHash:prev,
    hash:hash,
    time:Date.now(),
    txs:[{type:'BUY', from:vqiAddr, ethFrom:wallet.address, to:'MARKET', amount:need, symbol:s, usd:u, sig:sig, msg:msg}]
  });
  saveChain();
};

window.sell = async (s,u) => {
  let msg = `SELL ${s} ${u} ${Date.now()}`;
  let sig = await wallet.signMessage(msg);
  let prev = chain[chain.length-1].hash;
  let hash = await sha256(prev+s+u+sig);
  chain.push({
    index:chain.length,
    prevHash:prev,
    hash:hash,
    time:Date.now(),
    txs:[{type:'SELL', from:vqiAddr, ethFrom:wallet.address, to:'MARKET', amount:u*10000, symbol:s, usd:u, sig:sig, msg:msg}]
  });
  saveChain();
};

window.loadMarket = async (t) => {
  let c = document.getElementById('market');
  c.innerHTML = '';
  let l = document.createElement('div');
  l.innerText = 'Loading '+t+' LIVE...';
  c.appendChild(l);
  try{
    let data=[];
    if(t==='coin'){
      let r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&per_page=10&page=1');
      let j = await r.json();
      data = j.map(x=>({s:x.symbol.toUpperCase(), p:x.current_price}));
    }else{
      let r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
      let j = await r.json();
      data = Object.entries(j.rates).slice(0,10).map(([k,v])=>({s:k+'/USD', p:(1/v).toFixed(4)}));
    }
    c.innerHTML='';
    data.forEach(o=>{
      let row=document.createElement('div');
      row.className='row';
      let a=document.createElement('span');
      a.innerText=o.s+' $'+o.p;
      let b=document.createElement('span');
      let b1=document.createElement('button');
      b1.innerText='BUY';
      b1.style='background:#00ff88;border:none;padding:6px 10px;border-radius:8px;margin-right:4px';
      b1.onclick=()=>buy(o.s,10);
      let b2=document.createElement('button');
      b2.innerText='SELL';
      b2.style='background:#ff4444;color:#fff;border:none;padding:6px 10px;border-radius:8px';
      b2.onclick=()=>sell(o.s,10);
      b.append(b1,b2);
      row.append(a,b);
      c.appendChild(row);
    });
  }catch(e){
    c.innerText='Error: '+e.message;
  }
};

window.doHistory = () => {
  let v=document.getElementById('chainview');
  v.style.display='block';
  v.innerHTML='';
  chain.slice(-15).reverse().forEach(b=>{
    let d=document.createElement('div');
    d.innerText=`#${b.index} ${b.hash.slice(0,12)} ${b.txs.map(t=>t.type+' '+t.amount).join(',')}`;
    v.appendChild(d);
  });
};

window.renderFlags = async () => {
  let s=document.getElementById('country');
  try{
    let r=await fetch('https://restcountries.com/v3.1/all?fields=cca2,name');
    let j=await r.json();
    j.sort((a,b)=>a.name.common.localeCompare(b.name.common)).forEach(c=>{
      let o=document.createElement('option');
      o.value=c.cca2;
      o.innerText=c.name.common;
      s.appendChild(o);
    });
  }catch(e){}
};

if(localStorage.getItem('vqi_enc')) unlock();
</script>
</body>
</html>
