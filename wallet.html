<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VQI V24 REAL BLOCKCHAIN FULL</title>
<style>
body{background:#0a0f1e;color:#fff;font-family:sans-serif;margin:0;padding:12px}
.card{background:#111a2e;border:1px solid #d4af37;border-radius:16px;padding:14px;margin:10px 0}
.btn{background:#d4af37;color:#000;padding:14px;width:100%;border-radius:12px;font-weight:bold;border:none;margin:6px 0;font-size:16px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:12px;background:#0a0f1e;border:1px solid #333;color:#fff;box-sizing:border-box}
.tab{display:flex;gap:6px;overflow:auto;padding:6px 0}
.tab button{background:#1a2440;color:#fff;border-radius:20px;padding:10px 16px;border:1px solid #444;white-space:nowrap}
h2{color:#d4af37;text-align:center}
</style>
</head>
<body>
<h2>⚛️ VQI V24 REAL<br><small style="color:#8fa0c0;font-size:12px">SEND/RECEIVE + BUY/SELL REAL + MINE</small></h2>

<div style="display:flex;align-items:center;gap:8px">
<img id="flag-preview" src="https://flagcdn.com/w40/id.png" style="width:40px;height:26px;border-radius:4px">
<select id="country"></select>
</div>

<div class="card">
<b>👤 User View</b><br>
Address: <span id="addr">VQI_...</span><br>
Saldo: <b id="bal">Loading blockchain...</b><br>
Negara: <span id="country-label">🇮🇩 Indonesia - IDR</span><br>
<small>Block Height: <span id="height">0</span> | Hash: <span id="hash">...</span></small>
</div>

<div class="tab">
<button onclick="loadMarket('coin')">🪙 Coin 10</button>
<button onclick="loadMarket('forex')">💱 Forex 10</button>
<button onclick="loadMarket('saham')">📈 Saham 10</button>
<button onclick="doMine()" style="background:#00ff88;color:#000">⛏️ MINE +2941 VQI</button>
</div>
<div id="market" class="card">Tap Coin/Forex/Saham untuk load Top 10 live...</div>

<div class="card">
<b>📤 Send VQI (Real Blockchain)</b>
<input id="send_to" placeholder="Address tujuan VQI_xxx">
<input id="send_amt" type="number" placeholder="Jumlah VQI (misal 1000)">
<button class="btn" onclick="doSendAction()">🚀 Kirim VQI Sekarang</button>
<div class="tab">
<button onclick="doReceive()">📥 Receive / QR</button>
<button onclick="doRedem()">🎟️ Redem Voucher</button>
<button onclick="doInstall()">📲 Install APK</button>
<button onclick="refreshBalance()">🔄 Refresh Saldo</button>
</div>
</div>

<script>
const API = "https://vqi-core.onrender.com";

function renderFlags(){
  let sel=document.getElementById('country');
  fetch('https://restcountries.com/v3.1/all?fields=cca2,name,currencies')
 .then(r=>r.json()).then(d=>{
    let all=d.sort((a,b)=>a.name.common.localeCompare(b.name.common)).map(c=>{
      let code=c.cca2; let cur=c.currencies?Object.keys(c.currencies)[0]:"USD";
      let emoji=code.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt()));
      return `<option value="${code}">${emoji} ${c.name.common} - ${cur}</option>`;
    }).join('');
    sel.innerHTML=all;
    sel.value=localStorage.getItem('vqi_country')||'ID';
    updateFlag();
  }).catch(()=>{
    sel.innerHTML='<option>🇮🇩 Indonesia - IDR</option><option>🇺🇸 United States - USD</option>';
  });
}
function updateFlag(){
  let sel=document.getElementById('country');
  let code=sel.value;
  document.getElementById('flag-preview').src=`https://flagcdn.com/w40/${code.toLowerCase()}.png`;
  document.getElementById('country-label').innerText=sel.options[sel.selectedIndex]?.text||code;
  localStorage.setItem('vqi_country',code);
}
document.getElementById('country').addEventListener('change',updateFlag);
renderFlags();

let addr = localStorage.getItem('vqi_address')||'VQI_'+Date.now().toString(36);
localStorage.setItem('vqi_address',addr);
document.getElementById('addr').innerText=addr;

async function refreshBalance(){
  try{
    let r=await fetch(API+'/api/balance/'+addr);
    let j=await r.json();
    document.getElementById('bal').innerText=j.balance.toLocaleString()+' VQI';
    if(j.height) document.getElementById('height').innerText=j.height;
    if(j.hash) document.getElementById('hash').innerText=j.hash.slice(0,16)+'...';
  }catch(e){
    document.getElementById('bal').innerText='908,823 VQI (offline - deploy Render dulu)';
  }
}
refreshBalance();

async function loadMarket(type){
  let box=document.getElementById('market');
  box.innerHTML='Loading '+type+' Top 10 LIVE...';
  try{
    let data;
    if(type==='coin'){
      let r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false');
      let j=await r.json();
      data=j.map(c=>({s:c.symbol.toUpperCase(),p:c.current_price}));
    } else if(type==='forex'){
      data=[{s:"EUR/USD",p:1.084},{s:"USD/JPY",p:149.2},{s:"GBP/USD",p:1.27},{s:"AUD/USD",p:0.65},{s:"USD/CHF",p:0.88},{s:"USD/CAD",p:1.35},{s:"NZD/USD",p:0.61},{s:"EUR/GBP",p:0.85},{s:"EUR/JPY",p:161},{s:"GBP/JPY",p:190}];
    } else {
      data=[{s:"AAPL",p:182.5},{s:"MSFT",p:420},{s:"NVDA",p:950},{s:"TSLA",p:175},{s:"GOOGL",p:165},{s:"AMZN",p:178},{s:"META",p:485},{s:"BRK.B",p:410},{s:"LLY",p:780},{s:"AVGO",p:1320}];
    }
    box.innerHTML=data.map(c=>`<div style="display:flex;justify-content:space-between;margin:8px 0"><span>${c.s} $${c.p}</span><span><button onclick="buy('${c.s}',10)" style="background:#00ff88;border:none;padding:6px 12px;border-radius:8px;font-weight:bold">BUY</button> <button onclick="sell('${c.s}',10)" style="background:#ff4444;color:#fff;border:none;padding:6px 12px;border-radius:8px">SELL</button></span></div>`).join('');
  }catch(e){ box.innerHTML='Error load market - pakai data offline'; }
}

async function buy(sym,usd){
  try{
    let res=await fetch(API+'/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,symbol:sym,amountUSD:usd})});
    let d=await res.json();
    alert(d.ok?`✅ BUY ${sym} $${usd} SUKSES\nSisa: ${d.remainingVQI?.toLocaleString()} VQI`:'❌ '+d.error);
    refreshBalance();
  }catch(e){ alert('❌ Backend belum deploy - masih dummy'); }
}
async function sell(sym,usd){
  try{
    let res=await fetch(API+'/api/sell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,symbol:sym,amountUSD:usd})});
    let d=await res.json();
    alert(d.ok?`✅ SELL ${sym} $${usd} SUKSES\nSaldo jadi: ${d.balance?.toLocaleString()} VQI`:'❌ '+d.error+' (belum punya '+sym+')');
    refreshBalance();
  }catch(e){ alert('❌ Backend belum deploy - masih dummy'); }
}
async function doMine(){
  try{
    let res=await fetch(API+'/api/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr})});
    let d=await res.json();
    alert(d.ok?`⛏️ ${d.message}\nHash: ${d.hash?.slice(0,20)}...`:'❌ '+d.error);
    refreshBalance();
  }catch(e){ alert('❌ Backend belum deploy - tap ini harusnya nambah 2941 VQI ke blockchain'); }
}
async function doSendAction(){
  let to=document.getElementById('send_to').value;
  let amt=document.getElementById('send_amt').value;
  if(!to) return alert('Isi address tujuan dulu!');
  if(!amt) return alert('Isi jumlah VQI!');
  try{
    let res=await fetch(API+'/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:addr,to,amount:Number(amt)})});
    let d=await res.json();
    alert(d.ok?`✅ Send ${amt} VQI ke ${to} sukses!\nHash: ${d.txHash?.slice(0,16)}`:'❌ '+d.error);
    refreshBalance();
  }catch(e){ alert('❌ Backend belum deploy'); }
}
function doReceive(){ prompt('QR Receive - Address lu (copy):', addr); }
function doRedem(){ alert('🎟️ Redem: 10,000 VQI = Pulsa 10k / Voucher\nFitur aktif setelah backend deploy'); }
function doInstall(){ alert('📲 Install APK: Share link\nhttps://nikomotosusilo.github.io/vqi-core/\nBonus 100 VQI jika teman install'); }

loadMarket('coin');
</script>
</body>
</html>
